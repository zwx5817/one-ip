name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync without overwriting fork changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          # 1. 查户口：确认你的仓库是从原作者那里 Fork 来的
          metadata=$(gh api "repos/$REPO")
          parent=$(jq -r '.parent.full_name' <<< "$metadata")
          branch=$(jq -r '.default_branch' <<< "$metadata")
          
          if [ "$parent" != 'zhihui-hu/one-ip' ]; then
            echo '【拒绝】你的仓库不是直接从 zhihui-hu/one-ip Fork 来的，无法同步。'
            exit 0
          fi
          
          echo "【确认】上游仓库是: $parent，开始尝试合并..."
          
          # 2. 发起合并（这一句就是核心，GitHub会自动去拉原仓库代码）
          # 如果发生冲突，这一句会直接报错退出，绝不动你的原代码
          gh api --method POST "repos/$REPO/merge-upstream" -f branch="$branch"
          
          echo "【成功】合并完成！"
